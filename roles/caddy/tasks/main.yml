---
- name: Resolve the effective route list
  ansible.builtin.include_tasks: routes.yml

# The schema cannot make these unrepresentable, so they fail the converge instead.
- name: Assert every route declares a TLS mode
  ansible.builtin.assert:
    that:
      - item.tls is defined
      - item.tls in ['acme', 'cert']
    fail_msg: >-
      Route {{ item.host }} needs `tls: acme` or `tls: cert`.
    quiet: true
  loop: "{{ caddy_all_routes }}"
  loop_control:
    label: "{{ item.host }}"
  # No default may replace this: the template once emitted
  # `tls <certs>/default.pem` unconditionally, at a file no ACME host writes, and
  # an ACME-only host could not converge at all.

- name: Assert an ACME account email is set when any route uses ACME
  ansible.builtin.assert:
    that:
      - caddy_acme_email is defined
      - caddy_acme_email | length > 0
    fail_msg: >-
      Routes use `tls: acme` but caddy_acme_email is unset. Set it fleet-wide;
      it is an address, not a credential, so it needs no vault.
    quiet: true
  when: caddy_all_routes | selectattr('tls', 'equalto', 'acme') | list | length > 0
  # ADR-0006: the email is what admits ZeroSSL as a fallback issuer. Absent,
  # Caddy's chain silently shrinks to Let's Encrypt alone.

- name: Assert at most one proxy provider fronts this host
  ansible.builtin.assert:
    that:
      - caddy_all_routes | selectattr('proxied_by', 'defined')
        | map(attribute='proxied_by') | unique | list | length <= 1
    fail_msg: >-
      Routes name more than one `proxied_by` provider. Trust is server-level in
      Caddy and every vhost shares :443, so one host can trust one provider.
    quiet: true
  # The ranges could union; `client_ip_headers` could not — two providers on one
  # host is unrepresentable in Caddy.

# The third schema constraint, unasserted above because it cannot be:
# `upstreams[].paths` must stay LITERAL strings. Ansible renders a var before the
# role sees it, so `/api/{{ version }}/*` arrives as `/api/v1/*` and the assert
# passes every time. The check must read the inventory YAML raw, which puts it in
# the consuming repo's CI, not in this role. Cost of getting it wrong:
# defaults/main.yml, by the field.

# The Cloudsmith apt source is REMOVED, not just unused: a source that answers
# 402 fails every `apt update` on the box (os, docker, update.yml), so leaving
# it behind from an older converge breaks roles that never touch Caddy.
- name: Remove the Cloudsmith Caddy apt source and its key
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/caddy.sources
    - /etc/apt/sources.list.d/caddy.list
    - /usr/share/keyrings/caddy-stable-archive-keyring.gpg

- name: Read the package architecture
  ansible.builtin.command: dpkg --print-architecture
  register: caddy_dpkg_arch
  changed_when: false
  check_mode: false

- name: Assert a release checksum exists for this architecture
  ansible.builtin.assert:
    that:
      - caddy_dpkg_arch.stdout in caddy_deb_sha512
    fail_msg: >-
      caddy_deb_sha512 has no entry for {{ caddy_dpkg_arch.stdout }} — add the
      sha512 of caddy_{{ caddy_version }}_linux_{{ caddy_dpkg_arch.stdout }}.deb
      from the release's checksums.txt.
    quiet: true

# Not /var/cache/apt/archives: `apt clean` empties it, and every converge after
# would re-download a package nothing changed.
- name: Ensure the Caddy package cache dir
  ansible.builtin.file:
    path: /var/cache/caddy-release
    state: directory
    owner: root
    group: root
    mode: "0755"
  register: caddy_release_dir

# Check mode on a fresh host has neither the dir nor the file: both skip there.
- name: Download the Caddy release package
  ansible.builtin.get_url:
    url: "https://github.com/caddyserver/caddy/releases/download/v{{ caddy_version }}/caddy_{{ caddy_version }}_linux_{{ caddy_dpkg_arch.stdout }}.deb"
    dest: "/var/cache/caddy-release/caddy_{{ caddy_version }}_linux_{{ caddy_dpkg_arch.stdout }}.deb"
    checksum: "sha512:{{ caddy_deb_sha512[caddy_dpkg_arch.stdout] }}"
    mode: "0644"
  register: caddy_deb
  when: not (ansible_check_mode and caddy_release_dir is changed)

# Same package the apt repo shipped (postinst creates the `caddy` user, starts +
# enables the unit); the service task below guards against a hand-disable.
#   * Never run `caddy upgrade`: it self-replaces the binary in place, and dpkg
#     still records the old version, so this task sees nothing to do and the
#     stray binary survives until the next caddy_version bump clobbers it.
#   * Standard modules only. A third-party plugin (DNS-challenge, WAF) means
#     leaving the .deb for an xcaddy build.
- name: Install caddy
  ansible.builtin.apt:
    deb: "{{ caddy_deb.dest }}"
  when: not (ansible_check_mode and (caddy_deb is skipped or caddy_deb is changed))

- name: Ensure certs dir
  ansible.builtin.file:
    path: "{{ caddy_certs_dir }}"
    state: directory
    owner: root
    group: caddy
    mode: "0750"

# --- Default cert (one CF zone — covers most hosts) ---
- name: Drop default origin certificate
  ansible.builtin.copy:
    dest: "{{ caddy_certs_dir }}/default.pem"
    content: "{{ caddy_origin_cert }}"
    owner: root
    group: caddy
    mode: "0640"
  when: caddy_origin_cert is defined and caddy_origin_cert | length > 0
  notify: Reload caddy

- name: Drop default origin private key
  ansible.builtin.copy:
    dest: "{{ caddy_certs_dir }}/default.key"
    content: "{{ caddy_origin_key }}"
    owner: root
    group: caddy
    mode: "0640"
  when: caddy_origin_key is defined and caddy_origin_key | length > 0
  no_log: true
  notify: Reload caddy

# --- Extra certs (multi-zone hosts only — caddy_extra_certs in host_vars) ---
- name: Drop extra origin certificates
  ansible.builtin.copy:
    dest: "{{ caddy_certs_dir }}/{{ item.name }}.pem"
    content: "{{ item.cert }}"
    owner: root
    group: caddy
    mode: "0640"
  loop: "{{ caddy_extra_certs }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.cert | default('') | length > 0
  notify: Reload caddy

- name: Drop extra origin private keys
  ansible.builtin.copy:
    dest: "{{ caddy_certs_dir }}/{{ item.name }}.key"
    content: "{{ item.key }}"
    owner: root
    group: caddy
    mode: "0640"
  loop: "{{ caddy_extra_certs }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.key | default('') | length > 0
  no_log: true
  notify: Reload caddy

# The next task's `validate:` runs `caddy validate` as root, which Provision()'s
# the file logger and creates a missing log file root-owned — runtime Caddy (uid
# caddy) then can't write it, causing endless reload-timeout loops. Pre-creating
# them caddy-owned makes validate a no-op.
- name: Ensure per-vhost access log files exist (caddy-owned)
  ansible.builtin.file:
    path: "/var/log/caddy/{{ item.host }}.log"
    state: touch
    owner: caddy
    group: caddy
    mode: "0640"
    access_time: preserve
    modification_time: preserve
  loop: "{{ caddy_all_routes }}"
  loop_control:
    label: "{{ item.host }}"
  changed_when: false

# 0640: the file is deployable config a non-service user has no business
# reading — and route auth material (basic_auth hashes) is valid Caddyfile
# content a consumer's routes can carry, so world-read is a habit worth
# never forming. caddy reads it through its group; validate and reload
# run as root. A DECLARED EXCEPTION to ADR-0001's no_log rule: what a
# route can carry here is a bcrypt hash, never a plaintext, and censoring
# the task would censor the caddy validate stderr a broken render needs
# to fail with.
- name: Render Caddyfile
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: /etc/caddy/Caddyfile
    owner: root
    group: caddy
    mode: "0640"
    validate: "caddy validate --config %s --adapter caddyfile"
  notify: Reload caddy

- name: Ensure caddy is enabled and running
  ansible.builtin.service:
    name: caddy
    state: started
    enabled: true
  when: not ansible_check_mode
